<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Eventos climáticos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="topo">
        <h1>Eventos climáticos</h1>
        <div class="usuario">
            <span>Olá, <strong id="nomeUsuario"></strong></span>
            <button id="sair" type="button" class="secundario">Sair</button>
        </div>
    </header>

    <main class="conteudo">
        <section class="cartao">
            <h2 id="tituloForm">Novo evento</h2>
            <form id="formEvento">
                <div class="campos">
                    <div>
                        <label for="cidade">Cidade</label>
                        <input id="cidade" name="cidade" maxlength="50" required>
                    </div>
                    <div>
                        <label for="tipoEvento">Tipo de evento</label>
                        <input id="tipoEvento" name="tipoEvento" placeholder="Ex.: Chuva forte" maxlength="50" required>
                    </div>
                    <div>
                        <label for="temperaturaMaxima">Temperatura máxima (°C)</label>
                        <input id="temperaturaMaxima" name="temperaturaMaxima" type="number" step="0.1">
                    </div>
                    <div>
                        <label for="data">Data e hora</label>
                        <input id="data" name="data" type="datetime-local">
                    </div>
                </div>

                <label for="nivelImpacto">Impacto</label>
                <input id="nivelImpacto" name="nivelImpacto" placeholder="Ex.: Alagamento de ruas" maxlength="100" required>

                <div class="acoes">
                    <button id="salvar" type="submit">Cadastrar evento</button>
                    <button id="cancelar" type="button" class="secundario" hidden>Cancelar edição</button>
                </div>
                <p id="mensagemForm" class="mensagem" role="status"></p>
            </form>
        </section>

        <section class="cartao">
            <h2>Meus eventos</h2>
            <p id="mensagemLista" class="mensagem" role="status">Carregando eventos...</p>
            <div id="listaEventos" class="lista"></div>
        </section>
    </main>
</body>
</html>
